name: CI - DocteurFlotte World-Class Governance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Test & Sovereign Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Contracts
        run: pnpm --filter @docteurflotte/contracts build

      - name: Linting
        run: pnpm lint

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Automated Test Suites
        run: pnpm test

      - name: Run Sovereign & Security Guardrails
        run: node scripts/guardrails/verify-all.cjs
        env:
          NODE_ENV: test
          JWT_SECRET: docteurflotte_ci_dummy_secret_with_more_than_32_characters_strictly_for_tests

